  <body>
    
<header class="max-w-5xl mx-auto mb-4 px-4">
    <h1 class="text-3xl font-extrabold">
        <a href="/online-course-notes-11ty/" class="text-brand hover:text-brand-dark transition-colors">
            Course Notes
        </a>
    </h1>
</header>
<div class="max-w-5xl mx-auto px-4 flex flex-col gap-4 md:grid md:grid-cols-[280px_1fr] md:gap-8 items-start">
    <nav class="sidebar w-full bg-card rounded-cu p-4 border border-border-line shadow-cu-sm">
        <ul><li class="active-list-item"><a href="/online-course-notes-11ty/" class="active bg-red-100 text-brand-dark font-bold hover:bg-red-200">Course Notes</a><ul><li><a href="/online-course-notes-11ty/notes/">First Notes Page</a></li></ul></li>
<li><a href="/online-course-notes-11ty/about/">About</a></li></ul>
    </nav>
    <div class="content prose w-full bg-card rounded-cu p-6 md:p-8 border border-border-line shadow-cu-lg">
        
        <h1>Hello World</h1>
<p>z</p>

        <div class="nextprev mt-12 pt-8 border-t border-border-line flex flex-col gap-4 sm:flex-row sm:justify-between sm:items-center">
        </div>
        <div class="comments mt-12 pt-8 border-t border-border-line">
            <script src="https://utteranc.es/client.js" repo="martinjc/online-course-notes-11ty" issue-term="title" theme="github-light" crossorigin="anonymous" async=""></script>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.answer-block').forEach(d => {
        d.addEventListener('click', (e) => {
            d
                .querySelector('.feedback')
                .classList
                .toggle('hidden');
            d.classList.toggle('selected');
        });
    });
    const urlParams = new URLSearchParams(window.location.search);
    const embed = urlParams.get('embed');
    const print = urlParams.get('print');
    if (embed || print) {
        document.querySelectorAll('.comments').forEach(d => {
            d.classList.toggle('hidden');
        });
        document.querySelectorAll('.sidebar').forEach(d => {
            d.classList.toggle('hidden');
        });
        document.querySelectorAll('.breadcrumb').forEach(d => {
            d.classList.toggle('hidden');
        });
        document.querySelectorAll('.nextprev').forEach(d => {
            d.classList.toggle('hidden');
        });
    }
    if(print) {
        document.querySelectorAll('.panoptoembed').forEach(d => {
            d.classList.toggle('hidden');
        });
    }
</script>
  </body>
</html>
